<svg viewBox="0 0 760 212" width="760" height="212" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Figma to GitHub sync flow</title>
<desc>Six-step flow: read Figma, read GitHub, diff per key, resolve conflicts, branch and open a PR, then apply GitHub's side back to Figma immediately, even before the PR merges.</desc>
<style>
  .bg{ fill:#eef1ec; }
  .box rect{ fill:#ffffff; stroke:#c9d0c5; stroke-width:1; }
  .c-amber rect{ fill:#f6ead6; stroke:#a4611a; stroke-width:1; }
  text{ font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; }
  .th{ font-size:14px; font-weight:600; fill:#131a15; }
  .ts{ font-size:12px; fill:#5b665f; }
  .c-amber .th, .c-amber .ts{ fill:#7a4712; }
  .arr{ stroke:#7c8880; stroke-width:1.5; fill:none; }
  @media (prefers-color-scheme: dark){
    .bg{ fill:#0e1310; }
    .box rect{ fill:#161d18; stroke:#2c352e; }
    .c-amber rect{ fill:#2a2114; stroke:#e0a961; }
    .th{ fill:#e9ece6; }
    .ts{ fill:#9aa79d; }
    .c-amber .th, .c-amber .ts{ fill:#e0a961; }
    .arr{ stroke:#6c766f; }
  }
</style>
<rect class="bg" x="0" y="0" width="760" height="212"/>
<defs><marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<line x1="240" y1="48" x2="280" y2="48" class="arr" marker-end="url(#arrow2)"/>
<line x1="480" y1="48" x2="520" y2="48" class="arr" marker-end="url(#arrow2)"/>
<line x1="620" y1="76" x2="620" y2="136" class="arr" marker-end="url(#arrow2)"/>
<line x1="520" y1="164" x2="480" y2="164" class="arr" marker-end="url(#arrow2)"/>
<line x1="280" y1="164" x2="240" y2="164" class="arr" marker-end="url(#arrow2)"/>

<g class="box"><rect x="40" y="20" width="200" height="56" rx="4"/>
<text x="140" y="43" text-anchor="middle" class="th">1. Read Figma</text>
<text x="140" y="61" text-anchor="middle" class="ts">code.ts, no network</text></g>

<g class="box"><rect x="280" y="20" width="200" height="56" rx="4"/>
<text x="380" y="43" text-anchor="middle" class="th">2. Read GitHub</text>
<text x="380" y="61" text-anchor="middle" class="ts">Fetch tokens file</text></g>

<g class="box"><rect x="520" y="20" width="200" height="56" rx="4"/>
<text x="620" y="43" text-anchor="middle" class="th">3. Diff per key</text>
<text x="620" y="61" text-anchor="middle" class="ts">Added, removed, modified</text></g>

<g class="box"><rect x="520" y="136" width="200" height="56" rx="4"/>
<text x="620" y="159" text-anchor="middle" class="th">4. Resolve conflicts</text>
<text x="620" y="177" text-anchor="middle" class="ts">Figma, GitHub, or skip</text></g>

<g class="box"><rect x="280" y="136" width="200" height="56" rx="4"/>
<text x="380" y="159" text-anchor="middle" class="th">5. Branch + PR</text>
<text x="380" y="177" text-anchor="middle" class="ts">Never a direct commit</text></g>

<g class="c-amber"><rect x="40" y="136" width="200" height="56" rx="4"/>
<text x="140" y="159" text-anchor="middle" class="th">6. Apply to Figma</text>
<text x="140" y="177" text-anchor="middle" class="ts">Runs before the PR merges</text></g>
</svg>
