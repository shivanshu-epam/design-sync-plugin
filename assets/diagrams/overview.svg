<svg viewBox="0 0 760 352" width="760" height="352" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Design Sync architecture overview</title>
<desc>Figma connects bidirectionally to design-tokens.json, the single source of truth. That file pushes to Storybook and to Teams/Slack notifications. Separately, a JIRA ticket triggers an agent that opens a pull request against the same file; the pull request always needs a human merge and reports its outcome back to JIRA.</desc>
<style>
  .bg{ fill:#eef1ec; }
  .box rect{ fill:#ffffff; stroke:#c9d0c5; stroke-width:1; }
  .c-amber rect{ fill:#f6ead6; stroke:#a4611a; stroke-width:1; }
  text{ font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; }
  .th{ font-size:14px; font-weight:600; fill:#131a15; }
  .ts{ font-size:12px; fill:#5b665f; }
  .c-amber .th, .c-amber .ts{ fill:#7a4712; }
  .arr{ stroke:#7c8880; stroke-width:1.5; fill:none; }
  .legend{ font-size:12px; fill:#5b665f; }
  @media (prefers-color-scheme: dark){
    .bg{ fill:#0e1310; }
    .box rect{ fill:#161d18; stroke:#2c352e; }
    .c-amber rect{ fill:#2a2114; stroke:#e0a961; }
    .th{ fill:#e9ece6; }
    .ts{ fill:#9aa79d; }
    .c-amber .th, .c-amber .ts{ fill:#e0a961; }
    .arr{ stroke:#6c766f; }
    .legend{ fill:#9aa79d; }
  }
</style>
<rect class="bg" x="0" y="0" width="760" height="352"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<line x1="380" y1="76" x2="380" y2="136" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line x1="280" y1="192" x2="280" y2="252" class="arr" marker-end="url(#arrow)"/>
<line x1="480" y1="252" x2="480" y2="192" class="arr" marker-end="url(#arrow)"/>
<path d="M260,192 L260,222 L80,222 L80,252" fill="none" class="arr" marker-end="url(#arrow)"/>
<line x1="550" y1="280" x2="610" y2="280" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

<g class="box"><rect x="295" y="20" width="170" height="56" rx="4"/>
<text x="380" y="43" text-anchor="middle" class="th">Figma</text>
<text x="380" y="61" text-anchor="middle" class="ts">Styles + Variables</text></g>

<g class="box"><rect x="250" y="136" width="260" height="56" rx="4"/>
<text x="380" y="159" text-anchor="middle" class="th">design-tokens.json</text>
<text x="380" y="177" text-anchor="middle" class="ts">Source of truth</text></g>

<g class="box"><rect x="10" y="252" width="140" height="56" rx="4"/>
<text x="80" y="275" text-anchor="middle" class="th">Storybook</text>
<text x="80" y="293" text-anchor="middle" class="ts">Docs site</text></g>

<g class="box"><rect x="210" y="252" width="140" height="56" rx="4"/>
<text x="280" y="275" text-anchor="middle" class="th">Teams / Slack</text>
<text x="280" y="293" text-anchor="middle" class="ts">Sync alerts</text></g>

<g class="c-amber"><rect x="410" y="252" width="140" height="56" rx="4"/>
<text x="480" y="275" text-anchor="middle" class="th">Pull request</text>
<text x="480" y="293" text-anchor="middle" class="ts">No auto-merge</text></g>

<g class="c-amber"><rect x="610" y="252" width="140" height="56" rx="4"/>
<text x="680" y="275" text-anchor="middle" class="th">JIRA · DS</text>
<text x="680" y="293" text-anchor="middle" class="ts">Ticket intake</text></g>

<text x="10" y="340" class="legend">Amber = the JIRA-triggered path. Gray = the Figma/plugin path. Both end at the same file.</text>
</svg>
