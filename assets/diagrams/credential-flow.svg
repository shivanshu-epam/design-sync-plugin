<svg viewBox="0 0 700 378" width="700" height="378" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Design Sync credential and integration flow</title>
<desc>Four rows, each showing one credential, where it is stored, what consumes it, and what system it authenticates to: the GitHub PAT from Figma clientStorage authenticates ui.ts to the GitHub API; Teams and Slack webhook URLs stored as repo secrets are used by notify-on-sync.yml to post to each channel independently; JIRA secrets authenticate jira-client.mjs to the JIRA REST API; the built-in GITHUB_TOKEN lets ticket-agent.yml push a branch and open a pull request that is never auto-merged.</desc>
<style>
  .bg{ fill:#eef1ec; }
  .box rect{ fill:#ffffff; stroke:#c9d0c5; stroke-width:1; }
  .c-amber rect{ fill:#f6ead6; stroke:#a4611a; stroke-width:1; }
  text{ font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; }
  .th{ font-size:14px; font-weight:600; fill:#131a15; }
  .ts{ font-size:12px; fill:#5b665f; }
  .c-amber .th, .c-amber .ts{ fill:#7a4712; }
  .arr{ stroke:#7c8880; stroke-width:1.5; fill:none; }
  .legend{ font-size:12px; fill:#5b665f; }
  @media (prefers-color-scheme: dark){
    .bg{ fill:#0e1310; }
    .box rect{ fill:#161d18; stroke:#2c352e; }
    .c-amber rect{ fill:#2a2114; stroke:#e0a961; }
    .th{ fill:#e9ece6; }
    .ts{ fill:#9aa79d; }
    .c-amber .th, .c-amber .ts{ fill:#e0a961; }
    .arr{ stroke:#6c766f; }
    .legend{ fill:#9aa79d; }
  }
</style>
<rect class="bg" x="0" y="0" width="700" height="378"/>
<defs><marker id="arrow4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<line x1="220" y1="48" x2="260" y2="48" class="arr" marker-end="url(#arrow4)"/>
<line x1="460" y1="48" x2="500" y2="48" class="arr" marker-end="url(#arrow4)"/>
<line x1="220" y1="134" x2="260" y2="134" class="arr" marker-end="url(#arrow4)"/>
<line x1="460" y1="134" x2="500" y2="134" class="arr" marker-end="url(#arrow4)"/>
<line x1="220" y1="220" x2="260" y2="220" class="arr" marker-end="url(#arrow4)"/>
<line x1="460" y1="220" x2="500" y2="220" class="arr" marker-end="url(#arrow4)"/>
<line x1="220" y1="306" x2="260" y2="306" class="arr" marker-end="url(#arrow4)"/>
<line x1="460" y1="306" x2="500" y2="306" class="arr" marker-end="url(#arrow4)"/>

<g class="box"><rect x="20" y="20" width="200" height="56" rx="4"/><text x="120" y="43" text-anchor="middle" class="th">GitHub PAT</text><text x="120" y="61" text-anchor="middle" class="ts">Figma clientStorage</text></g>
<g class="box"><rect x="260" y="20" width="200" height="56" rx="4"/><text x="360" y="43" text-anchor="middle" class="th">ui.ts</text><text x="360" y="61" text-anchor="middle" class="ts">Plugin UI iframe</text></g>
<g class="box"><rect x="500" y="20" width="180" height="56" rx="4"/><text x="590" y="43" text-anchor="middle" class="th">GitHub API</text><text x="590" y="61" text-anchor="middle" class="ts">Contents, PRs, Actions</text></g>

<g class="box"><rect x="20" y="106" width="200" height="56" rx="4"/><text x="120" y="129" text-anchor="middle" class="th">Webhook URLs</text><text x="120" y="147" text-anchor="middle" class="ts">design-tokens secrets</text></g>
<g class="box"><rect x="260" y="106" width="200" height="56" rx="4"/><text x="360" y="129" text-anchor="middle" class="th">notify-on-sync.yml</text><text x="360" y="147" text-anchor="middle" class="ts">Teams + Slack builders</text></g>
<g class="box"><rect x="500" y="106" width="180" height="56" rx="4"/><text x="590" y="129" text-anchor="middle" class="th">Teams / Slack</text><text x="590" y="147" text-anchor="middle" class="ts">Posted independently</text></g>

<g class="c-amber"><rect x="20" y="192" width="200" height="56" rx="4"/><text x="120" y="215" text-anchor="middle" class="th">JIRA secrets</text><text x="120" y="233" text-anchor="middle" class="ts">Base URL, email, token</text></g>
<g class="c-amber"><rect x="260" y="192" width="200" height="56" rx="4"/><text x="360" y="215" text-anchor="middle" class="th">jira-client.mjs</text><text x="360" y="233" text-anchor="middle" class="ts">REST v2, Basic auth</text></g>
<g class="c-amber"><rect x="500" y="192" width="180" height="56" rx="4"/><text x="590" y="215" text-anchor="middle" class="th">JIRA REST API</text><text x="590" y="233" text-anchor="middle" class="ts">Comment + transition</text></g>

<g class="c-amber"><rect x="20" y="278" width="200" height="56" rx="4"/><text x="120" y="301" text-anchor="middle" class="th">GITHUB_TOKEN</text><text x="120" y="319" text-anchor="middle" class="ts">Auto-provided per run</text></g>
<g class="c-amber"><rect x="260" y="278" width="200" height="56" rx="4"/><text x="360" y="301" text-anchor="middle" class="th">ticket-agent.yml</text><text x="360" y="319" text-anchor="middle" class="ts">Push branch, open PR</text></g>
<g class="c-amber"><rect x="500" y="278" width="180" height="56" rx="4"/><text x="590" y="301" text-anchor="middle" class="th">design-tokens PR</text><text x="590" y="319" text-anchor="middle" class="ts">Never auto-merged</text></g>

<text x="20" y="366" class="legend">Amber = credentials used by the JIRA ticket-agent path. Gray = the Figma/plugin path.</text>
</svg>
