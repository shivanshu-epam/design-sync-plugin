<svg viewBox="0 0 900 664" width="900" height="664" xmlns="http://www.w3.org/2000/svg" role="img">
<title>JIRA ticket agent decision flow</title>
<desc>A ticket moved to Ready for Agent is fetched and parsed. If anything is unclear, missing, or stale, the agent comments and moves the ticket back to In Design without opening a branch. If it's clear, the agent opens a pull request, which always waits for an explicit human decision: merged moves the ticket to Live, closed without merging sends it back to In Design.</desc>
<style>
  .bg{ fill:#eef1ec; }
  .box rect{ fill:#ffffff; stroke:#c9d0c5; stroke-width:1; }
  .c-amber rect{ fill:#f6ead6; stroke:#a4611a; stroke-width:1; }
  text{ font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; }
  .th{ font-size:14px; font-weight:600; fill:#131a15; }
  .ts{ font-size:12px; fill:#5b665f; }
  .c-amber .th, .c-amber .ts{ fill:#7a4712; }
  .arr{ stroke:#7c8880; stroke-width:1.5; fill:none; }
  .legend{ font-size:12px; fill:#5b665f; }
  @media (prefers-color-scheme: dark){
    .bg{ fill:#0e1310; }
    .box rect{ fill:#161d18; stroke:#2c352e; }
    .c-amber rect{ fill:#2a2114; stroke:#e0a961; }
    .th{ fill:#e9ece6; }
    .ts{ fill:#9aa79d; }
    .c-amber .th, .c-amber .ts{ fill:#e0a961; }
    .arr{ stroke:#6c766f; }
    .legend{ fill:#9aa79d; }
  }
</style>
<rect class="bg" x="0" y="0" width="900" height="664"/>
<defs><marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<line x1="350" y1="76" x2="350" y2="136" class="arr" marker-end="url(#arrow3)"/>
<line x1="350" y1="192" x2="350" y2="252" class="arr" marker-end="url(#arrow3)"/>

<path d="M350,292 L350,322 L160,322 L160,352" fill="none" class="arr" marker-end="url(#arrow3)"/>
<path d="M350,292 L350,322 L560,322 L560,352" fill="none" class="arr" marker-end="url(#arrow3)"/>
<text x="230" y="316" class="ts">No</text>
<text x="440" y="316" class="ts">Yes</text>

<line x1="560" y1="408" x2="560" y2="468" class="arr" marker-end="url(#arrow3)"/>

<path d="M560,508 L560,538 L410,538 L410,568" fill="none" class="arr" marker-end="url(#arrow3)"/>
<path d="M560,508 L560,538 L710,538 L710,568" fill="none" class="arr" marker-end="url(#arrow3)"/>
<text x="455" y="532" class="ts">No</text>
<text x="635" y="532" class="ts">Yes</text>

<g class="box"><rect x="220" y="20" width="260" height="56" rx="4"/>
<text x="350" y="43" text-anchor="middle" class="th">Ticket: Ready for Agent</text>
<text x="350" y="61" text-anchor="middle" class="ts">Fires the Automation rule</text></g>

<g class="box"><rect x="220" y="136" width="260" height="56" rx="4"/>
<text x="350" y="159" text-anchor="middle" class="th">Agent fetches + parses</text>
<text x="350" y="177" text-anchor="middle" class="ts">REST v2, structured fields</text></g>

<g class="box"><rect x="220" y="252" width="260" height="40" rx="4"/>
<text x="350" y="277" text-anchor="middle" class="th">Token, value both valid?</text></g>

<g class="c-amber"><rect x="20" y="352" width="280" height="56" rx="4"/>
<text x="160" y="375" text-anchor="middle" class="th">Back to In Design</text>
<text x="160" y="393" text-anchor="middle" class="ts">Missing or stale info</text></g>

<g class="box"><rect x="420" y="352" width="280" height="56" rx="4"/>
<text x="560" y="375" text-anchor="middle" class="th">Open pull request</text>
<text x="560" y="393" text-anchor="middle" class="ts">design-sync/agent-{key}</text></g>

<g class="box"><rect x="430" y="468" width="260" height="40" rx="4"/>
<text x="560" y="493" text-anchor="middle" class="th">Human merges the PR?</text></g>

<g class="c-amber"><rect x="280" y="568" width="260" height="56" rx="4"/>
<text x="410" y="591" text-anchor="middle" class="th">Back to In Design</text>
<text x="410" y="609" text-anchor="middle" class="ts">PR closed, no merge</text></g>

<g class="box"><rect x="580" y="568" width="260" height="56" rx="4"/>
<text x="710" y="591" text-anchor="middle" class="th">Ticket: Live</text>
<text x="710" y="609" text-anchor="middle" class="ts">Change is now in the file</text></g>

<text x="20" y="646" class="legend">Amber = the ticket bounces back to "In Design" for revision — no assumptions are ever made.</text>
</svg>
