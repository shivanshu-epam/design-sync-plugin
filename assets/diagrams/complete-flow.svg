<svg viewBox="0 0 1260 500" width="1260" height="500" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Design Sync — complete plugin and JIRA agent flow</title>
<desc>Top lane: Figma document, code.ts, and ui.ts, connected bidirectionally, with ui.ts reading GitHub directly and opening pull requests. Middle lane: the pull request gate and design-tokens.json, which feed Storybook, GitHub Pages, and Teams/Slack notifications. Bottom lane: a JIRA ticket triggers an Automation rule, which dispatches the ticket agent; the agent opens a pull request through the same gate, and when that pull request closes, a resolve script reports the outcome back to the originating JIRA ticket, closing the loop.</desc>
<style>
  .bg{ fill:#eef1ec; }
  .box rect{ fill:#ffffff; stroke:#c9d0c5; stroke-width:1; }
  .c-amber rect{ fill:#f6ead6; stroke:#a4611a; stroke-width:1; }
  .c-teal rect{ fill:#dff2ec; stroke:#0e6e5c; stroke-width:1.4; }
  text{ font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; }
  .th{ font-size:14px; font-weight:600; fill:#131a15; }
  .ts{ font-size:12px; fill:#5b665f; }
  .lbl{ font-size:10px; fill:#5b665f; }
  .lbl.amber{ fill:#a4611a; }
  .c-amber .th, .c-amber .ts{ fill:#7a4712; }
  .c-teal .th, .c-teal .ts{ fill:#0a5346; }
  .arr{ stroke:#7c8880; stroke-width:1.5; fill:none; }
  .arr.amber{ stroke:#a4611a; }
  .arr.dashed{ stroke-dasharray:4 4; }
  .lane{ fill:#5b665f; font-size:11px; font-weight:700; letter-spacing:.06em; }
  .legend{ font-size:12px; fill:#5b665f; }
  @media (prefers-color-scheme: dark){
    .bg{ fill:#0e1310; }
    .box rect{ fill:#161d18; stroke:#2c352e; }
    .c-amber rect{ fill:#2a2114; stroke:#e0a961; }
    .c-teal rect{ fill:#152722; stroke:#4fd6ae; }
    .th{ fill:#e9ece6; }
    .ts{ fill:#9aa79d; }
    .lbl{ fill:#9aa79d; }
    .lbl.amber{ fill:#e0a961; }
    .c-amber .th, .c-amber .ts{ fill:#e0a961; }
    .c-teal .th, .c-teal .ts{ fill:#8de9cd; }
    .arr{ stroke:#6c766f; }
    .arr.amber{ stroke:#e0a961; }
    .lane{ fill:#9aa79d; }
    .legend{ fill:#9aa79d; }
  }
</style>
<rect class="bg" x="0" y="0" width="1260" height="500"/>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<text x="40" y="14" class="lane">FIGMA PLUGIN</text>
<text x="40" y="160" class="lane">GITHUB — DESIGN-TOKENS REPO</text>
<text x="40" y="346" class="lane">JIRA TICKET AGENT</text>

<!-- ============ NODES (drawn first so arrow labels always paint on top) ============ -->

<!-- lane 1: plugin -->
<g class="box"><rect x="40" y="20" width="200" height="56" rx="4"/>
<text x="140" y="43" text-anchor="middle" class="th">Figma</text>
<text x="140" y="61" text-anchor="middle" class="ts">Styles + Variables</text></g>

<g class="box"><rect x="300" y="20" width="200" height="56" rx="4"/>
<text x="400" y="43" text-anchor="middle" class="th">code.ts</text>
<text x="400" y="61" text-anchor="middle" class="ts">Sandbox, no network</text></g>

<g class="box"><rect x="560" y="20" width="200" height="56" rx="4"/>
<text x="660" y="43" text-anchor="middle" class="th">ui.ts</text>
<text x="660" y="61" text-anchor="middle" class="ts">Iframe, network + GitHub</text></g>

<!-- lane 2a: hub -->
<g class="c-teal"><rect x="560" y="166" width="200" height="56" rx="4"/>
<text x="660" y="189" text-anchor="middle" class="th">Pull request</text>
<text x="660" y="207" text-anchor="middle" class="ts">Never auto-merged</text></g>

<g class="box"><rect x="800" y="166" width="260" height="56" rx="4"/>
<text x="930" y="189" text-anchor="middle" class="th">design-tokens.json</text>
<text x="930" y="207" text-anchor="middle" class="ts">Source of truth + audit log</text></g>

<!-- lane 2b: downstream -->
<g class="box"><rect x="40" y="262" width="200" height="56" rx="4"/>
<text x="140" y="285" text-anchor="middle" class="th">Teams / Slack</text>
<text x="140" y="303" text-anchor="middle" class="ts">Independently, on merge</text></g>

<g class="box"><rect x="800" y="262" width="180" height="56" rx="4"/>
<text x="890" y="285" text-anchor="middle" class="th">Storybook</text>
<text x="890" y="303" text-anchor="middle" class="ts">4 token pages</text></g>

<g class="box"><rect x="1020" y="262" width="180" height="56" rx="4"/>
<text x="1110" y="285" text-anchor="middle" class="th">GitHub Pages</text>
<text x="1110" y="303" text-anchor="middle" class="ts">Deployed docs site</text></g>

<!-- lane 3: jira agent -->
<g class="c-amber"><rect x="40" y="352" width="200" height="56" rx="4"/>
<text x="140" y="375" text-anchor="middle" class="th">JIRA ticket</text>
<text x="140" y="393" text-anchor="middle" class="ts">Ready for Agent</text></g>

<g class="c-amber"><rect x="300" y="352" width="200" height="56" rx="4"/>
<text x="400" y="375" text-anchor="middle" class="th">Automation rule</text>
<text x="400" y="393" text-anchor="middle" class="ts">Work item transitioned</text></g>

<g class="c-amber"><rect x="560" y="352" width="220" height="56" rx="4"/>
<text x="670" y="375" text-anchor="middle" class="th">ticket-agent.mjs</text>
<text x="670" y="393" text-anchor="middle" class="ts">Fetch, resolve, validate</text></g>

<g class="c-amber"><rect x="800" y="352" width="220" height="56" rx="4"/>
<text x="910" y="375" text-anchor="middle" class="th">resolve.mjs</text>
<text x="910" y="393" text-anchor="middle" class="ts">Reports outcome to JIRA</text></g>

<!-- ============ EDGES + LABELS ============ -->

<!-- lane 1 arrows -->
<line x1="240" y1="48" x2="300" y2="48" class="arr" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="270" y="40" text-anchor="middle" class="lbl">figma.* API</text>
<line x1="500" y1="48" x2="560" y2="48" class="arr" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="530" y="40" text-anchor="middle" class="lbl">postMessage</text>

<!-- ui.ts -> PR gate (write) -->
<line x1="660" y1="76" x2="660" y2="166" class="arr" marker-end="url(#a)"/>
<text x="668" y="124" class="lbl">branch + PR</text>

<!-- ui.ts -> tokens.json (read, dashed) -->
<path d="M750,76 L750,140 L930,140 L930,166" fill="none" class="arr dashed" marker-end="url(#a)"/>
<text x="770" y="134" class="lbl">read (GET)</text>

<!-- PR gate -> tokens.json (merge) -->
<line x1="760" y1="194" x2="800" y2="194" class="arr" marker-end="url(#a)"/>
<text x="780" y="186" text-anchor="middle" class="lbl">merge</text>

<!-- tokens.json -> Storybook -->
<line x1="890" y1="222" x2="890" y2="262" class="arr" marker-end="url(#a)"/>
<text x="898" y="246" class="lbl">rebuild — deploy-storybook.yml</text>

<!-- Storybook -> Pages -->
<line x1="980" y1="290" x2="1020" y2="290" class="arr" marker-end="url(#a)"/>
<text x="1000" y="282" text-anchor="middle" class="lbl">deploy</text>

<!-- tokens.json -> Teams/Slack -->
<path d="M820,222 L820,242 L140,242 L140,262" fill="none" class="arr" marker-end="url(#a)"/>
<text x="440" y="236" class="lbl">notify — notify-on-sync.yml</text>

<!-- lane 3 arrows -->
<line x1="240" y1="380" x2="300" y2="380" class="arr amber" marker-end="url(#a)"/>
<text x="270" y="372" text-anchor="middle" class="lbl amber">status</text>
<line x1="500" y1="380" x2="560" y2="380" class="arr amber" marker-end="url(#a)"/>
<text x="530" y="372" text-anchor="middle" class="lbl amber">dispatch</text>

<!-- ticket-agent.mjs -> PR gate (opens PR) -->
<line x1="650" y1="352" x2="650" y2="222" class="arr amber" marker-end="url(#a)"/>
<text x="605" y="290" class="lbl amber">opens PR</text>

<!-- PR gate -> resolve.mjs (closed) -->
<path d="M700,222 L700,335 L910,335 L910,352" fill="none" class="arr amber" marker-end="url(#a)"/>
<text x="705" y="329" class="lbl amber">closed — ticket-agent-resolve.yml</text>

<!-- resolve.mjs -> JIRA ticket (loop closes) -->
<path d="M910,408 L910,430 L140,430 L140,408" fill="none" class="arr amber" marker-end="url(#a)"/>
<text x="480" y="424" class="lbl amber">comment + transition</text>

<text x="40" y="452" class="legend">Amber = the JIRA-triggered path. Teal = the one gate every change passes through — never auto-merged. Gray = the Figma/plugin path and its downstream fan-out.</text>
<text x="40" y="470" class="legend">Dashed = a read-only call. Every arrow into "Pull request" ends in a human merge — nothing here calls a merge API.</text>
<text x="40" y="488" class="legend">The Storybook rebuild is the one step here that only runs when a human clicks it (workflow_dispatch) — every other automation fires on its own.</text>
</svg>
