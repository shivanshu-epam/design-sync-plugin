<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Design Sync</title>
<style>
  /*
   * Developer-tool palette (slate + blue + green), chosen via the
   * ui-ux-pro-max skill's own search tool against this project's actual
   * shape: "Developer Tool / IDE" and "Minimalism & Swiss Style" were its
   * closest product-type matches (the latter's own description: "Best for:
   * ...dashboards, documentation sites, SaaS platforms, professional
   * tools"), both flagged dual-mode (light + dark), which a Figma plugin
   * needs since Figma itself runs in both.
   *
   * --accent and --cta are each used in two different roles that pull in
   * opposite directions for contrast: white text ON TOP of a solid button
   * (needs a darker shade), and the same color used AS text/links against
   * the page background (needs a lighter shade in dark mode, since the bg
   * is near-black). No single hue satisfies both at a full 4.5:1 in dark
   * mode — verified with an actual WCAG relative-luminance calculation,
   * not eyeballed — so --accent (#3678E2) is deliberately tuned to the
   * best achievable balance point for both roles (~4.2:1 each) rather than
   * optimizing one role at the other's expense. --cta only ever backs
   * white text (never used as inline link text), so it's picked purely for
   * that: 5.02:1 in both modes.
   */
  :root {
    color-scheme: light dark;
    --chrome-bg: #0f172a;       /* slate-900 — nav chrome stays dark in both modes */
    --chrome-text: #94a3b8;     /* slate-400 */
    --chrome-text-active: #f8fafc;

    --bg: #f8fafc;              /* slate-50 — page background */
    --surface: #ffffff;         /* panels, inputs */
    --bg-subtle: #f1f5f9;       /* slate-100 — code/log blocks */
    --border: #e2e8f0;          /* slate-200 */
    --text: #0f172a;            /* slate-900 — 17.1:1 on --bg */
    --text-muted: #64748b;      /* slate-500 — 4.6:1 on --bg */
    --text-placeholder: #94a3b8; /* slate-400 */

    --accent: #3678e2;          /* primary actions, links — see note above */
    --accent-hover: #2a5ec4;
    --accent-text: #ffffff;

    --cta: #15803d;             /* sync/commit action, Figma-source chip — 5.0:1 w/ white text */
    --cta-hover: #11642f;

    --danger: #dc2626;          /* red-600 — 4.8:1 on --bg */
    --danger-hover: #b91c1c;
    --danger-bg: #fee2e2;

    --success-bg: #dcfce7;
    --success-text: #14532d;    /* 8.3:1 on --success-bg */

    --warn: #b45309;            /* amber-700, not the more common 600 — 600 is only 3.2:1 on white, fails as icon/text color */
    --warn-bg: #fef3c7;

    --radius: 5px;
    --overlay-shadow: 0 4px 14px rgba(15, 23, 42, 0.12); /* the one floating element (repo search menu) — everything else in this app signals elevation with a border alone */
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --chrome-bg: #020617;     /* slate-950 */
      --chrome-text: #94a3b8;

      --bg: #0f172a;            /* slate-900 */
      --surface: #1b2336;       /* elevated above --bg */
      --bg-subtle: #171f30;
      --border: #334155;        /* slate-700 */
      --text: #f8fafc;          /* slate-50 — 17.1:1 on --bg */
      --text-muted: #94a3b8;    /* slate-400 — 7.0:1 on --bg */
      --text-placeholder: #64748b;

      --accent: #3678e2;        /* same hex as light — see note above */
      --accent-hover: #5a93ea;  /* hover brightens in dark mode, not darkens */

      --cta: #15803d;           /* same hex as light — only ever backs white text */
      --cta-hover: #1d9a4b;

      --danger: #ef4444;        /* red-500 — 4.7:1 on dark --bg (red-600 would only be 3.7:1) */
      --danger-hover: #f87171;
      --danger-bg: #450a0a;

      --success-bg: #052e16;
      --success-text: #86efac;  /* 10.6:1 on --success-bg */

      --warn: #f59e0b;          /* amber-500 — 8.3:1 on dark --bg */
      --warn-bg: #451a03;

      --overlay-shadow: 0 4px 14px rgba(0, 0, 0, 0.4); /* dark surfaces need a stronger, darker shadow to read as elevated at all */
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    font-size: 13px;
    line-height: 1.45;
    color: var(--text);
    background: var(--bg);
  }
  #app { display: flex; flex-direction: column; height: 100vh; }

  /* Icons — inline SVGs from icons.ts (Phosphor, regular weight), sized to
     match surrounding text via currentColor + em-relative sizing isn't
     needed since each <svg> already carries explicit width/height. */
  .icon { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; line-height: 0; }
  .icon svg { display: block; }
  .icon.spin svg { animation: icon-spin 0.9s linear infinite; }
  .icon.info-hint { color: var(--text-muted); cursor: help; align-self: center; }
  @keyframes icon-spin { to { transform: rotate(360deg); } }

  header.app-header { flex-shrink: 0; background: var(--chrome-bg); }
  .app-title {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 9px 12px 7px;
    color: var(--chrome-text-active);
    font-weight: 700;
    font-size: 12.5px;
    letter-spacing: 0.01em;
  }
  .app-logo { color: var(--accent); }
  nav.tabs { display: flex; }
  .tab-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 8px 4px 7px;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    font-family: inherit;
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 0.01em;
    line-height: 1.25;
    color: var(--chrome-text);
    cursor: pointer;
  }
  .tab-btn .icon { color: var(--chrome-text); }
  .tab-btn.active { color: var(--chrome-text-active); border-bottom-color: var(--accent); }
  .tab-btn.active .icon { color: var(--accent); }

  main#panel { flex: 1; overflow-y: auto; padding: 12px; background: var(--bg); }
  footer.app-footer {
    flex-shrink: 0;
    padding: 5px 12px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-placeholder);
    font-size: 9.5px;
    text-align: right;
  }
  h2 { font-size: 12px; margin: 0 0 8px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); font-weight: 700; }
  .section-divider { border: none; border-top: 1px solid var(--border); margin: 18px 0 14px; }
  .required-mark { color: var(--danger); margin-left: 3px; }
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
  .field label { font-weight: 600; }
  .field input, .field select {
    padding: 6px 9px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
  }
  .field input::placeholder { color: var(--text-placeholder); }
  .field input:focus, .field select:focus, table.token-table input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 25%, transparent);
  }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  button {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    padding: 7px 13px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--text-muted); }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
  /* The actual commit/push action gets UUI's "Call to action" green — its
     own distinct semantic from the blue "Primary Action" buttons (Save,
     Test connection, Fetch & compare). */
  button.cta { background: var(--cta); color: #ffffff; border-color: var(--cta); }
  button.cta:hover:not(:disabled) { background: var(--cta-hover); border-color: var(--cta-hover); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button + button { margin-left: 6px; }
  /* gap handles spacing (buttons, and now also tags/icons mixed in) —
     button + button's margin-left would double up with it, so it's reset
     to 0 here rather than stacking. */
  .btn-row { margin-top: 10px; display: flex; align-items: center; gap: 8px; }
  .btn-row > button + button { margin-left: 0; }
  /* Native <input list> + <datalist> is unreliable inside a Figma plugin's
     sandboxed iframe — the browser-native popup would silently vanish as
     soon as the user kept typing or the input regained focus. Rendered by
     hand instead, fully under our control. */
  .repo-search-wrap { position: relative; flex: 1; }
  /* Same visual treatment as .field input — this one just isn't inside a
     .field, since it shares its row with the reload button. */
  .repo-search-wrap input {
    width: 100%;
    padding: 6px 9px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
  }
  .repo-search-wrap input::placeholder { color: var(--text-placeholder); }
  .repo-search-wrap input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 25%, transparent);
  }
  .repo-search-menu {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    z-index: 20;
    max-height: 180px;
    overflow-y: auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--overlay-shadow);
  }
  .repo-search-option {
    padding: 6px 9px;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .repo-search-option:hover, .repo-search-option.active { background: var(--bg-subtle); }
  .repo-search-option + .repo-search-option { border-top: 1px solid var(--border); }
  .repo-search-empty { padding: 6px 9px; font-size: 11.5px; color: var(--text-muted); }
  .hint { color: var(--text-muted); font-size: 11.5px; margin-top: 4px; }
  .status-banner {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 9px 11px;
    border-radius: var(--radius);
    /* Was margin-bottom only — a banner directly after a .btn-row (e.g.
       Connect/Test/Cancel's result) sat flush against the buttons with
       0px gap above it. */
    margin: 10px 0;
    font-size: 12px;
    line-height: 1.5;
    border: 1px solid transparent;
  }
  .status-banner.success { background: var(--success-bg); color: var(--success-text); border-color: var(--cta); }
  .status-banner.error { background: var(--danger-bg); color: var(--text); border-color: var(--danger); }
  .status-banner.info { background: var(--bg-subtle); color: var(--text); border-color: var(--accent); }
  .status-banner-icon { margin-top: 2px; }
  .status-banner.success .status-banner-icon { color: var(--cta); }
  .status-banner.error .status-banner-icon { color: var(--danger); }
  .status-banner.info .status-banner-icon { color: var(--accent); }
  .status-banner-content { flex: 1 1 auto; min-width: 0; }
  .status-banner ul { margin: 4px 0 0; padding: 0 0 0 16px; }
  .status-banner li { margin-bottom: 2px; }
  table.token-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  table.token-table th, table.token-table td {
    text-align: left; padding: 6px 7px; border-bottom: 1px solid var(--border); font-size: 12px;
  }
  table.token-table th { color: var(--text-muted); font-weight: 700; text-transform: uppercase; font-size: 10px; letter-spacing: 0.04em; }
  table.token-table input { width: 100%; padding: 4px 6px; font-size: 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--text); font-family: inherit; }
  .icon-btn { padding: 5px 7px; font-size: 11px; }

  /* Diff rows (Sync tab conflicts, History tab entries) — the part of the
     UI most reported as hard to read. Figma/GitHub values used to sit
     side-by-side in two ~180px columns at 10px monospace, which made any
     reference path or long hex string nearly unreadable. Each value now
     gets its own full-width line with a colored label chip, stacked
     vertically, at a size that's actually comfortable to read. */
  .diff-group { margin-bottom: 16px; }
  .diff-group h2 { display: flex; align-items: center; gap: 8px; }
  .status-section-heading { display: flex; align-items: center; gap: 6px; }
  .status-section-heading .icon + .icon { margin-left: -2px; }
  .status-section-heading .tag { margin-left: 2px; }
  .diff-row { border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 11px; margin-bottom: 8px; background: var(--surface); }
  .diff-row.status-added-figma { border-left: 3px solid var(--cta); }
  .diff-row.status-added-github { border-left: 3px solid var(--accent); }
  .diff-row.status-modified { border-left: 3px solid var(--warn); background: var(--warn-bg); }
  .diff-key { font-weight: 700; font-size: 12.5px; margin-bottom: 7px; overflow-wrap: anywhere; }
  .diff-badge {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-size: 9.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--text-muted);
    background: var(--bg-subtle);
    border-radius: 2px;
    padding: 1px 5px;
    margin-left: 6px;
    vertical-align: middle;
  }
  .diff-values { display: flex; flex-direction: column; gap: 5px; margin-bottom: 8px; }
  .diff-value-line {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 4px 7px;
    font-family: ui-monospace, 'SF Mono', monospace;
    font-size: 12px;
    line-height: 1.5;
  }
  .diff-value-label {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    flex-shrink: 0;
    white-space: nowrap;
    font-family: inherit;
    font-size: 9.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 2px 6px;
    border-radius: 2px;
    color: #ffffff;
  }
  .diff-value-label.figma { background: var(--cta); }
  .diff-value-label.github { background: var(--accent); }
  .diff-value-text { color: var(--text); overflow-wrap: anywhere; flex: 1 1 auto; min-width: 0; }
  .diff-value-line .diff-badge { flex-shrink: 0; white-space: nowrap; align-self: center; }
  /* margin-top collapses with whatever precedes it — a no-op after
     .diff-values (already margin-bottom: 8px) but the fix for when a
     resolution-controls row follows a details.setup-guide instead (e.g.
     History's Revert button after the collapsed change list), which has
     margin-top but no margin-bottom of its own and would otherwise sit
     flush against it. */
  .resolution-controls { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px; }
  .resolution-controls label { font-weight: 500; font-size: 12px; }
  /* Segmented icon-button toggle replacing 3 radio+label pairs per conflict
     row — one joined group instead of 3 separately-bordered controls. */
  .resolution-toggle { display: inline-flex; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .resolution-toggle button {
    margin: 0;
    padding: 5px 9px;
    border: none;
    border-right: 1px solid var(--border);
    border-radius: 0;
    background: var(--surface);
    color: var(--text-muted);
  }
  .resolution-toggle button:last-child { border-right: none; }
  .resolution-toggle button:hover:not(:disabled) { background: var(--bg-subtle); color: var(--text); }
  .resolution-toggle button.active.figma { background: var(--cta); color: #ffffff; }
  .resolution-toggle button.active.github { background: var(--accent); color: #ffffff; }
  .resolution-toggle button.active.skip { background: var(--text-muted); color: var(--surface); }

  .audit-change-row {
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
  }
  .audit-change-row:last-child { border-bottom: none; }
  .audit-change-key {
    font-weight: 700;
    font-size: 11.5px;
    color: var(--text-muted);
    overflow-wrap: anywhere;
    margin-bottom: 3px;
  }
  .audit-change-values {
    font-family: ui-monospace, 'SF Mono', monospace;
    font-size: 12px;
    color: var(--text);
    overflow-wrap: anywhere;
    line-height: 1.5;
  }

  .empty-state { color: var(--text-muted); text-align: center; padding: 24px 0; font-size: 12.5px; line-height: 1.5; }
  pre#log {
    background: var(--bg-subtle);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 9px;
    font-size: 11px;
    line-height: 1.5;
    max-height: 140px;
    overflow-y: auto;
    white-space: pre-wrap;
    margin-top: 10px;
  }
  .history-item { font-size: 12px; padding: 6px 0; border-bottom: 1px solid var(--border); }
  .pr-link { display: inline-flex; align-items: center; gap: 4px; color: var(--accent); text-decoration: none; }
  .pr-link:hover { text-decoration: underline; }
  details.setup-guide {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-top: 10px;
    padding: 8px 10px;
    background: var(--surface);
  }
  details.setup-guide summary {
    cursor: pointer;
    font-weight: 600;
    font-size: 11px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  details.setup-guide summary .summary-icon { color: var(--text-muted); }
  /* Default browser marker replaced by our own CaretRight/CaretDown icon
     (see renderDetailsCaret in ui.ts) — a plain triangle looked out of
     place once every other disclosure/status signal in the UI got a
     proper icon. */
  details.setup-guide summary { list-style: none; }
  details.setup-guide summary::-webkit-details-marker { display: none; }
  details.setup-guide summary .caret { color: var(--text-muted); }
  details.setup-guide > div { margin-top: 8px; }
  details.setup-guide pre {
    background: var(--bg-subtle);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 8px;
    font-size: 10px;
    overflow-x: auto;
    white-space: pre;
  }
  details.setup-guide code {
    background: var(--bg-subtle);
    border-radius: 2px;
    padding: 1px 4px;
    font-size: 10px;
    font-family: ui-monospace, monospace;
  }
  /* A disclosure nested inside another one (e.g. Teams/Slack inside
     Notifications) — flattened, no border/background of its own, so
     opening the parent doesn't stack box-within-box. */
  details.setup-guide.nested {
    border: none;
    background: none;
    padding: 6px 0 2px 2px;
    margin-top: 2px;
  }
  details.setup-guide.nested > div { padding-left: 16px; }

  /* Connect tab: compact "already connected" card, replacing the full form
     once configured — the core ask behind this redesign pass. */
  .connect-card {
    display: flex;
    flex-direction: column;
    gap: 6px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 12px;
    background: var(--surface);
    margin-bottom: 10px;
  }
  .connect-card-header { display: flex; align-items: center; gap: 6px; }
  .connect-card-icon { color: var(--cta); }
  .connect-card-title { font-weight: 700; font-size: 13px; flex: 1 1 auto; }
  .connect-card-actions { display: flex; gap: 4px; }
  .connect-card-detail { font-size: 12.5px; color: var(--text-muted); }
  .connect-card-detail strong { color: var(--text); font-weight: 700; }
  .connect-security-line { display: flex; align-items: center; gap: 5px; }
  .connect-security-line .icon { color: var(--cta); }

  /* Small pill for a compact fact (a filename, a requirement) — replaces
     a "Requires <code>X</code> and <code>Y</code>..." sentence with
     something scannable at a glance instead of read word by word. */
  .tag-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .tag {
    font-family: ui-monospace, 'SF Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
    background: var(--bg-subtle);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 2px 8px;
  }
</style>
</head>
<body>
<div id="app">
  <header class="app-header">
    <div class="app-title"><span class="app-logo"></span>Design Sync</div>
    <nav class="tabs">
      <button class="tab-btn" data-tab="connect">Connect</button>
      <button class="tab-btn" data-tab="tokens">Custom Tokens</button>
      <button class="tab-btn" data-tab="sync">Sync</button>
      <button class="tab-btn" data-tab="status">Status</button>
      <button class="tab-btn" data-tab="history">History</button>
    </nav>
  </header>
  <main id="panel"></main>
  <footer class="app-footer">Design Sync v<!--APP_VERSION--></footer>
</div>
<!--DESIGN_SYNC_SCRIPT-->
</body>
</html>
