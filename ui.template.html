<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Design Sync</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --bg-subtle: #f5f5f5;
    --border: #e6e6e6;
    --text: #1a1a1a;
    --text-muted: #6b6b6b;
    --accent: #18a0fb;
    --accent-text: #ffffff;
    --danger: #d64545;
    --danger-bg: #fdecec;
    --success: #1a9c5a;
    --success-bg: #e9f9f0;
    --warn: #b8860b;
    --warn-bg: #fdf6e3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #2c2c2c;
      --bg-subtle: #383838;
      --border: #454545;
      --text: #f2f2f2;
      --text-muted: #a3a3a3;
      --danger-bg: #3a2323;
      --success-bg: #1e3327;
      --warn-bg: #3a3120;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif;
    font-size: 12px;
    color: var(--text);
    background: var(--bg);
  }
  #app { display: flex; flex-direction: column; height: 100vh; }
  header.tabs { display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .tab-btn {
    flex: 1;
    padding: 10px 8px;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    cursor: pointer;
  }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  main#panel { flex: 1; overflow-y: auto; padding: 12px; }
  h2 { font-size: 12px; margin: 0 0 8px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); }
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
  .field label { font-weight: 600; }
  .field input, .field select {
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--bg);
    color: var(--text);
    font-size: 12px;
  }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  button {
    font-size: 12px;
    padding: 7px 12px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: var(--bg-subtle);
    color: var(--text);
    cursor: pointer;
  }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button.primary:disabled { opacity: 0.5; cursor: not-allowed; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button + button { margin-left: 6px; }
  .btn-row { margin-top: 10px; display: flex; }
  .hint { color: var(--text-muted); font-size: 11px; margin-top: 4px; }
  .status-banner { padding: 8px 10px; border-radius: 4px; margin-bottom: 10px; font-size: 11px; }
  .status-banner.success { background: var(--success-bg); color: var(--success); }
  .status-banner.error { background: var(--danger-bg); color: var(--danger); }
  table.token-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  table.token-table th, table.token-table td {
    text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--border); font-size: 11px;
  }
  table.token-table th { color: var(--text-muted); font-weight: 600; }
  table.token-table input { width: 100%; padding: 4px 6px; font-size: 11px; border: 1px solid var(--border); border-radius: 3px; background: var(--bg); color: var(--text); }
  .icon-btn { padding: 3px 7px; font-size: 11px; }
  .diff-group { margin-bottom: 14px; }
  .diff-row { border: 1px solid var(--border); border-radius: 4px; padding: 8px; margin-bottom: 6px; }
  .diff-row.status-added-figma { border-left: 3px solid var(--success); }
  .diff-row.status-added-github { border-left: 3px solid var(--accent); }
  .diff-row.status-modified { border-left: 3px solid var(--warn); background: var(--warn-bg); }
  .diff-key { font-weight: 600; margin-bottom: 4px; }
  .diff-badge { font-size: 9px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-muted); margin-left: 6px; }
  .diff-values { display: flex; gap: 10px; font-family: ui-monospace, monospace; font-size: 10px; color: var(--text-muted); margin-bottom: 6px; }
  .diff-values > div { flex: 1; overflow-wrap: anywhere; }
  .resolution-controls label { margin-right: 10px; font-weight: 400; }
  .empty-state { color: var(--text-muted); text-align: center; padding: 24px 0; }
  pre#log {
    background: var(--bg-subtle);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px;
    font-size: 10px;
    max-height: 140px;
    overflow-y: auto;
    white-space: pre-wrap;
    margin-top: 10px;
  }
  .history-item { font-size: 11px; padding: 5px 0; border-bottom: 1px solid var(--border); }
  .history-item a { color: var(--accent); }
  details.setup-guide {
    border: 1px solid var(--border);
    border-radius: 4px;
    margin-top: 10px;
    padding: 8px 10px;
  }
  details.setup-guide summary { cursor: pointer; font-weight: 600; font-size: 11px; }
  details.setup-guide summary::marker { color: var(--text-muted); }
  details.setup-guide > div { margin-top: 8px; }
  details.setup-guide pre {
    background: var(--bg-subtle);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px;
    font-size: 10px;
    overflow-x: auto;
    white-space: pre;
  }
  details.setup-guide code {
    background: var(--bg-subtle);
    border-radius: 3px;
    padding: 1px 4px;
    font-size: 10px;
    font-family: ui-monospace, monospace;
  }
</style>
</head>
<body>
<div id="app">
  <header class="tabs">
    <button class="tab-btn" data-tab="connect">Connect</button>
    <button class="tab-btn" data-tab="tokens">Custom Tokens</button>
    <button class="tab-btn" data-tab="sync">Sync</button>
    <button class="tab-btn" data-tab="status">Status</button>
  </header>
  <main id="panel"></main>
</div>
<!--DESIGN_SYNC_SCRIPT-->
</body>
</html>
