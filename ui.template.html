<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Design Sync</title>
<style>
  /*
   * "Ledger" palette (v2, replaces the v1 slate+blue+green developer-tool
   * palette) — near-black ink on warm paper, one confident indigo accent,
   * semantic colors present but deliberately quieter than the accent so
   * they read as state, not brand. Chosen after an explicit audit (see
   * PROJECT.md/CHANGELOG) categorized the old palette as functionally
   * sound (icon+color pairing, never color-alone) but visually generic —
   * this keeps that behavior, changes only the values.
   *
   * Every foreground/background pairing below is verified against an
   * actual WCAG relative-luminance calculation, not eyeballed — same
   * discipline the v1 palette's own comment established. All pairs clear
   * 4.5:1 (several clear 6–19:1); see the CHANGELOG entry for this
   * revamp for the exact computed ratios.
   */
  :root {
    color-scheme: light dark;
    --chrome-bg: #0a0a0a;       /* near-black — nav chrome stays dark in both modes */
    --chrome-text: #9c9b96;
    --chrome-text-active: #f5f5f4;

    --bg: #fafaf9;              /* warm paper, not blue-tinted white */
    --surface: #fafaf9;         /* same as --bg — panels separate by --bg-subtle, not a white-on-grey box */
    --bg-subtle: #f0efec;       /* recessed panel tone — accordions, code/log blocks */
    --border: #e2e0db;          /* hairline only — this palette leans on space/surface over borders */
    --text: #0a0a0a;            /* 18.96:1 on --bg */
    --text-muted: #6b6b68;      /* 5.12:1 on --bg */
    --text-placeholder: #a4a29c;

    --accent: #3f4dff;          /* Ledger's signature indigo — 5.41:1 as text, 5.65:1 backing white */
    --accent-hover: #2f3ce0;
    --accent-text: #ffffff;

    --cta: #1a7f4e;             /* sync/commit action — 4.80:1 on --bg, 5.01:1 backing white */
    --cta-hover: #146540;

    --danger: #c4361f;          /* desaturated relative to v1's red-600, sits quietly under --accent */
    --danger-hover: #a12c19;

    --warn: #a8590a;
    --warn-bg: #fbeed9;

    --radius: 2px;               /* was 5px — Ledger reads as cut, not rounded; 0 tested too harsh in review */
    --overlay-shadow: 0 4px 14px rgba(10, 10, 10, 0.1); /* the one floating element (repo search menu) — everything else signals elevation with surface color, not a shadow */

    /* Type scale — real jumps (was a flat 11–13px range with almost no
       weight contrast, which is why hierarchy read as weak despite a
       reasonable IA underneath it). */
    --fs-2xl: 22px;   /* section headers — was 12px uppercase small-caps */
    --fs-lg: 15px;    /* field labels, card titles */
    --fs-base: 13px;  /* body — unchanged, already reasonable at this panel width */
    --fs-sm: 12px;    /* secondary/meta text */
    --fs-xs: 10.5px;  /* eyebrows, tag text */
    --fw-bold: 800;
    --fw-medium: 600;
    --fw-normal: 400;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --chrome-bg: #050505;
      --chrome-text: #9c9b96;

      --bg: #0a0a0a;             /* true near-black, not slate-900's blue tint */
      --surface: #0a0a0a;
      --bg-subtle: #171716;
      --border: #2a2a28;
      --text: #f5f5f4;           /* 18.15:1 on --bg */
      --text-muted: #9c9b96;     /* 7.11:1 on --bg */
      --text-placeholder: #5c5b57;

      --accent: #7b84ff;         /* lighter than light-mode's accent — needed for contrast on near-black; 6.21:1 as text */
      --accent-hover: #9aa1ff;   /* hover brightens in dark mode, not darkens */
      --accent-text: #08081f;    /* dark ink on the light-in-dark-mode accent, not white — 6.19:1 */

      --cta: #3ecb84;            /* 9.50:1 on --bg */
      --cta-hover: #63d69c;

      --danger: #ff6b52;         /* light enough to clear 4.5:1 on near-black, still reads as the same hue as light mode's --danger */
      --danger-hover: #ff8a75;

      --warn: #e08a3c;
      --warn-bg: #2b2007;

      --overlay-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    font-size: 13px;
    line-height: 1.45;
    color: var(--text);
    background: var(--bg);
  }
  #app { display: flex; flex-direction: column; height: 100vh; }

  /* Icons — inline SVGs from icons.ts (Phosphor, regular weight), sized to
     match surrounding text via currentColor + em-relative sizing isn't
     needed since each <svg> already carries explicit width/height. */
  .icon { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; line-height: 0; }
  .icon svg { display: block; }
  .icon.spin svg { animation: icon-spin 0.9s linear infinite; }
  .icon.info-hint { color: var(--text-muted); cursor: help; align-self: center; }
  @keyframes icon-spin { to { transform: rotate(360deg); } }

  header.app-header { flex-shrink: 0; background: var(--chrome-bg); }
  .app-title {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 9px 12px 7px;
    color: var(--chrome-text-active);
    font-weight: 700;
    font-size: 12.5px;
    letter-spacing: 0.01em;
  }
  .app-logo { color: var(--accent); }
  nav.tabs { display: flex; }
  .tab-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 8px 4px 7px;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    font-family: inherit;
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 0.01em;
    line-height: 1.25;
    color: var(--chrome-text);
    cursor: pointer;
  }
  .tab-btn .icon { color: var(--chrome-text); }
  .tab-btn.active { color: var(--chrome-text-active); border-bottom-color: var(--accent); }
  .tab-btn.active .icon { color: var(--accent); }

  main#panel { flex: 1; overflow-y: auto; padding: 12px; background: var(--bg); }
  footer.app-footer {
    flex-shrink: 0;
    padding: 5px 12px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-placeholder);
    font-size: 9.5px;
    text-align: right;
  }
  /* Was 12px uppercase small-caps, doing hierarchy's job with letter-spacing
     instead of size — the single highest-impact change in this pass. Loud
     size + weight now carries what uppercase used to stand in for. */
  h2 { font-size: var(--fs-2xl); margin: 0 0 10px; color: var(--text); font-weight: var(--fw-bold); letter-spacing: -0.01em; }
  .section-divider { border: none; border-top: 1px solid var(--border); margin: 18px 0 14px; }
  .required-mark { color: var(--danger); margin-left: 3px; }
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
  .field label { font-weight: 600; }
  .field input, .field select {
    padding: 6px 9px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
  }
  .field input::placeholder { color: var(--text-placeholder); }
  .field input:focus, .field select:focus, table.token-table input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 25%, transparent);
  }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  /* Exactly one .primary/.cta per view stays a solid, loud fill — every
     other button (Cancel, Test, icon-btns) is deliberately quiet: a
     hairline border, transparent fill, muted text. Weight now comes from
     WHICH button is solid, not from every button looking the same. */
  button {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: inherit;
    font-size: var(--fs-sm);
    font-weight: var(--fw-medium);
    padding: 7px 13px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--text-muted); color: var(--text); }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: var(--fw-bold); }
  button.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); color: var(--accent-text); }
  /* The actual commit/push action gets its own distinct semantic from the
     accent-colored "Primary Action" buttons (Save, Test connection, Fetch
     & compare). */
  button.cta { background: var(--cta); color: #ffffff; border-color: var(--cta); font-weight: var(--fw-bold); }
  button.cta:hover:not(:disabled) { background: var(--cta-hover); border-color: var(--cta-hover); color: #ffffff; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button + button { margin-left: 6px; }
  /* gap handles spacing (buttons, and now also tags/icons mixed in) —
     button + button's margin-left would double up with it, so it's reset
     to 0 here rather than stacking. */
  /* margin-bottom mirrors margin-top so a button row sitting directly next
     to content with no margin of its own (e.g. History's entries list, or
     Sync's diff groups) doesn't end up flush against it — collapses
     harmlessly with whatever margin-top the next element already has. */
  .btn-row { margin-top: 10px; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .btn-row > button + button { margin-left: 0; }
  /* Native <input list> + <datalist> is unreliable inside a Figma plugin's
     sandboxed iframe — the browser-native popup would silently vanish as
     soon as the user kept typing or the input regained focus. Rendered by
     hand instead, fully under our control. */
  .repo-search-wrap { position: relative; flex: 1; }
  /* Same visual treatment as .field input — this one just isn't inside a
     .field, since it shares its row with the reload button. */
  .repo-search-wrap input {
    width: 100%;
    padding: 6px 9px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
  }
  .repo-search-wrap input::placeholder { color: var(--text-placeholder); }
  .repo-search-wrap input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 25%, transparent);
  }
  .repo-search-menu {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    z-index: 20;
    max-height: 180px;
    overflow-y: auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--overlay-shadow);
  }
  .repo-search-option {
    padding: 6px 9px;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .repo-search-option:hover, .repo-search-option.active { background: var(--bg-subtle); }
  .repo-search-option + .repo-search-option { border-top: 1px solid var(--border); }
  .repo-search-empty { padding: 6px 9px; font-size: 11.5px; color: var(--text-muted); }
  .hint { color: var(--text-muted); font-size: 11.5px; margin-top: 4px; }
  /* Was a full color-tinted fill + full-ring border per kind — replaced
     with one quiet neutral fill (--bg-subtle) and a colored LEFT EDGE
     only. The icon still carries the semantic color (never color-alone),
     but the banner itself separates from the page by surface tone, not by
     boxing itself in a loud, differently-tinted ring every time. */
  .status-banner {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 10px 12px;
    border-radius: var(--radius);
    /* Was margin-bottom only — a banner directly after a .btn-row (e.g.
       Connect/Test/Cancel's result) sat flush against the buttons with
       0px gap above it. */
    margin: 10px 0;
    font-size: var(--fs-sm);
    line-height: 1.5;
    background: var(--bg-subtle);
    border-left: 2px solid transparent;
  }
  .status-banner.success { border-left-color: var(--cta); color: var(--text); }
  .status-banner.error { border-left-color: var(--danger); color: var(--text); }
  .status-banner.info { border-left-color: var(--accent); color: var(--text); }
  .status-banner-icon { margin-top: 2px; }
  .status-banner.success .status-banner-icon { color: var(--cta); }
  .status-banner.error .status-banner-icon { color: var(--danger); }
  .status-banner.info .status-banner-icon { color: var(--accent); }
  .status-banner-content { flex: 1 1 auto; min-width: 0; }
  .update-banner-headline { display: flex; align-items: center; gap: 4px; font-weight: 600; }
  .update-banner-headline .icon-btn { margin-left: auto; flex-shrink: 0; }
  .status-banner ul { margin: 4px 0 0; padding: 0 0 0 16px; }
  .status-banner li { margin-bottom: 2px; }
  table.token-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  table.token-table th, table.token-table td {
    text-align: left; padding: 6px 7px; border-bottom: 1px solid var(--border); font-size: 12px;
  }
  table.token-table th { color: var(--text-muted); font-weight: 700; text-transform: uppercase; font-size: 10px; letter-spacing: 0.04em; }
  table.token-table input { width: 100%; padding: 4px 6px; font-size: 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--text); font-family: inherit; }
  .icon-btn { padding: 5px 7px; font-size: 11px; }

  /* Diff rows (Sync tab conflicts, History tab entries) — the part of the
     UI most reported as hard to read. Figma/GitHub values used to sit
     side-by-side in two ~180px columns at 10px monospace, which made any
     reference path or long hex string nearly unreadable. Each value now
     gets its own full-width line with a colored label chip, stacked
     vertically, at a size that's actually comfortable to read. */
  .diff-group { margin-bottom: 16px; }
  .diff-group h2 { display: flex; align-items: center; gap: 8px; }
  .status-section-heading { display: flex; align-items: center; gap: 6px; }
  .status-section-heading .icon + .icon { margin-left: -2px; }
  .status-section-heading .tag { margin-left: 2px; }
  .diff-row { border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 11px; margin-bottom: 8px; background: var(--surface); }
  .diff-row.status-added-figma { border-left: 3px solid var(--cta); }
  .diff-row.status-added-github { border-left: 3px solid var(--accent); }
  .diff-row.status-modified { border-left: 3px solid var(--warn); background: var(--warn-bg); }
  .diff-key { font-weight: 700; font-size: 12.5px; margin-bottom: 7px; overflow-wrap: anywhere; }
  .diff-badge {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-size: 9.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--text-muted);
    background: var(--bg-subtle);
    border-radius: 2px;
    padding: 1px 5px;
    margin-left: 6px;
    vertical-align: middle;
  }
  .diff-values { display: flex; flex-direction: column; gap: 5px; margin-bottom: 8px; }
  .diff-value-line {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 4px 7px;
    font-family: ui-monospace, 'SF Mono', monospace;
    font-size: 12px;
    line-height: 1.5;
  }
  .diff-value-label {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    flex-shrink: 0;
    white-space: nowrap;
    font-family: inherit;
    font-size: 9.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 2px 6px;
    border-radius: 2px;
    color: #ffffff;
  }
  .diff-value-label.figma { background: var(--cta); }
  .diff-value-label.github { background: var(--accent); }
  .diff-value-text { color: var(--text); overflow-wrap: anywhere; flex: 1 1 auto; min-width: 0; }
  .diff-value-line .diff-badge { flex-shrink: 0; white-space: nowrap; align-self: center; }
  /* margin-top collapses with whatever precedes it — a no-op after
     .diff-values (already margin-bottom: 8px) but the fix for when a
     resolution-controls row follows a details.setup-guide instead (e.g.
     History's Revert button after the collapsed change list), which has
     margin-top but no margin-bottom of its own and would otherwise sit
     flush against it. */
  .resolution-controls { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px; }
  .resolution-controls label { font-weight: 500; font-size: 12px; }
  /* Segmented icon-button toggle replacing 3 radio+label pairs per conflict
     row — one joined group instead of 3 separately-bordered controls. */
  .resolution-toggle { display: inline-flex; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .resolution-toggle button {
    margin: 0;
    padding: 5px 9px;
    border: none;
    border-right: 1px solid var(--border);
    border-radius: 0;
    background: var(--surface);
    color: var(--text-muted);
  }
  .resolution-toggle button:last-child { border-right: none; }
  .resolution-toggle button:hover:not(:disabled) { background: var(--bg-subtle); color: var(--text); }
  .resolution-toggle button.active.figma { background: var(--cta); color: #ffffff; }
  .resolution-toggle button.active.github { background: var(--accent); color: #ffffff; }
  .resolution-toggle button.active.skip { background: var(--text-muted); color: var(--surface); }

  .audit-change-row {
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
  }
  .audit-change-row:last-child { border-bottom: none; }
  .audit-change-key {
    font-weight: 700;
    font-size: 11.5px;
    color: var(--text-muted);
    overflow-wrap: anywhere;
    margin-bottom: 3px;
  }
  .audit-change-values {
    font-family: ui-monospace, 'SF Mono', monospace;
    font-size: 12px;
    color: var(--text);
    overflow-wrap: anywhere;
    line-height: 1.5;
  }

  .empty-state { color: var(--text-muted); text-align: center; padding: 24px 0; font-size: 12.5px; line-height: 1.5; }
  pre#log {
    background: var(--bg-subtle);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 9px;
    font-size: 11px;
    line-height: 1.5;
    max-height: 140px;
    overflow-y: auto;
    white-space: pre-wrap;
    margin-top: 10px;
  }
  .history-item { font-size: 12px; padding: 6px 0; border-bottom: 1px solid var(--border); }
  .pr-link { display: inline-flex; align-items: center; gap: 4px; color: var(--accent); text-decoration: none; }
  .pr-link:hover { text-decoration: underline; }
  /* Was a bordered card (border + --surface fill, which is identical to
     --bg now anyway) — replaced with a recessed --bg-subtle panel and no
     border, consistent with separating content by surface tone instead of
     boxing every container in a ring. */
  details.setup-guide {
    border-radius: var(--radius);
    margin-top: 10px;
    padding: 9px 11px;
    background: var(--bg-subtle);
  }
  details.setup-guide summary {
    cursor: pointer;
    font-weight: var(--fw-medium);
    font-size: var(--fs-sm);
    display: flex;
    align-items: center;
    gap: 5px;
  }
  details.setup-guide summary .summary-icon { color: var(--text-muted); }
  /* Default browser marker replaced by our own CaretRight/CaretDown icon
     (see renderDetailsCaret in ui.ts) — a plain triangle looked out of
     place once every other disclosure/status signal in the UI got a
     proper icon. */
  details.setup-guide summary { list-style: none; }
  details.setup-guide summary::-webkit-details-marker { display: none; }
  details.setup-guide summary .caret { color: var(--text-muted); }
  details.setup-guide > div { margin-top: 8px; }
  /* Parent is now the recessed tone (--bg-subtle) — code blocks inside use
     --surface (the "paper" tone) instead, so they still read as a distinct
     block rather than disappearing into an identical background. */
  details.setup-guide pre {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 8px;
    font-size: 10px;
    overflow-x: auto;
    white-space: pre;
  }
  details.setup-guide code {
    background: var(--surface);
    border-radius: 2px;
    padding: 1px 4px;
    font-size: 10px;
    font-family: ui-monospace, monospace;
  }
  /* A disclosure nested inside another one (e.g. Teams/Slack inside
     Notifications) — flattened, no border/background of its own, so
     opening the parent doesn't stack box-within-box. */
  details.setup-guide.nested {
    border: none;
    background: none;
    padding: 6px 0 2px 2px;
    margin-top: 2px;
  }
  details.setup-guide.nested > div { padding-left: 16px; }

  /* Connect tab: compact "already connected" card, replacing the full form
     once configured — the core ask behind this redesign pass. Was a
     bordered/radius/filled box — the exact "boxing everything" pattern
     Ledger replaces with space + a single line of separation, matching
     the approved mockup's borderless, bottom-line treatment. */
  .connect-card {
    display: flex;
    flex-direction: column;
    gap: 6px;
    border-bottom: 1px solid var(--border);
    padding: 4px 2px 14px;
    margin-bottom: 12px;
  }
  .connect-card-header { display: flex; align-items: center; gap: 7px; }
  .connect-card-icon { color: var(--cta); }
  .connect-card-title { font-weight: var(--fw-bold); font-size: var(--fs-lg); letter-spacing: -0.01em; flex: 1 1 auto; }
  .connect-card-actions { display: flex; gap: 2px; }
  /* Quiet monospace-uppercase actions, no border — the card itself no
     longer has an edge to sit inside of. */
  .connect-card-actions .icon-btn {
    border: none;
    background: transparent;
    font-family: ui-monospace, 'SF Mono', monospace;
    font-size: var(--fs-xs);
    font-weight: var(--fw-bold);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 4px 8px;
  }
  .connect-card-actions .icon-btn:hover:not(:disabled) { color: var(--text); border-color: transparent; }
  .connect-card-detail { font-size: var(--fs-sm); color: var(--text-muted); font-family: ui-monospace, 'SF Mono', monospace; }
  .connect-card-detail strong { color: var(--text); font-weight: var(--fw-bold); font-family: inherit; }
  .connect-security-line { display: flex; align-items: center; gap: 5px; }
  .connect-security-line .icon { color: var(--cta); }

  /* Small label for a compact fact (a filename, a requirement) — replaces
     a "Requires <code>X</code> and <code>Y</code>..." sentence with
     something scannable at a glance instead of read word by word. Was a
     999px pill — the most rounded shape possible, directly at odds with
     Ledger's sharp-cornered language — now a plain label, no border, set
     apart by uppercase + letter-spacing instead of a pill outline. */
  .tag-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
  .tag {
    font-family: ui-monospace, 'SF Mono', monospace;
    font-size: var(--fs-xs);
